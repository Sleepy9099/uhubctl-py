[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "uhubctl-py"
dynamic = ["version"]
description = "Typed Python control layer for uhubctl: per-port USB hub power control"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Rojae Johnson" }]
keywords = ["usb", "hub", "uhubctl", "power", "libusb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
uhubctl-py = "uhubctl_py.cli:main"

[project.urls]
Upstream = "https://github.com/mvp/uhubctl"

[tool.hatch.version]
path = "src/uhubctl_py/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs a real uhubctl-compatible hub (set UHUBCTL_HW=1)"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
